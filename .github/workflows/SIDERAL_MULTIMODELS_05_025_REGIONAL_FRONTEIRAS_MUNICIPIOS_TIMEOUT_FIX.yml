# SIDERAL MULTIMODELS 0.25 — workflow YAML único, com correção do horizonte nativo do ICON
# e correção do lat/lon da grade icosaédrica nativa do ICON (CLAT/CLON).
# Este é o ÚNICO arquivo que precisa ser enviado ao repositório GitHub.
# O motor (Python/configuração/testes) está embutido como pacote comprimido e é
# reconstruído apenas dentro do runner temporário. YAML orquestra os passos;
# a decodificação GRIB2, interpolação e cálculos meteorológicos continuam sendo
# executados pelo motor Python, pois Actions YAML não implementa essas operações.
# Modelos: ECMWF IFS Open Data, NOAA GFS e DWD ICON Global. Grade de saída: 0,25°; produtos exportados separadamente por região.
# Saída: frames PNG/JSON a cada hora entre os leads nativos; os interpolados são identificados.
# Catálogo: 39 variáveis. Saídas independentes para Sudeste, Sul, Centro-Oeste, Nordeste, Norte do Brasil e Argentina.
# tp6h é acumulado em 6 h e não recebe valores artificiais nos horários intermediários.
# Fix 1: o downloader ICON ignora leads acima do horizonte nativo (ex.: F126 quando o ciclo termina em F120).
# Fix 2: o ICON Global é publicado em grade icosaédrica (não estruturada); o GRIB2 de cada
#        campo não traz lat/lon, então o motor agora baixa as coordenadas nativas CLAT/CLON
#        (uma vez por rodada) e as usa para regrade por vizinho mais próximo, evitando o erro
#        "Nenhuma variável reconhecida em f000.grib2".
# A grade meteorológica de saída é de 0,25°. Os PNGs incluem contornos estaduais/provinciais e limites municipais brasileiros; a grade não é mascarada por fronteiras políticas. Regiões configuradas dentro do pacote Python embutido.
# Fix GFS: grupos NOMADS separados; consultas individuais indisponíveis são ignoradas sem interromper a rodada; retry HTTP e pausa de 10 s.

name: SIDERAL MULTIMODELS 0.25 - Regiões, estados e municípios

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Data UTC YYYYMMDD; vazio = seleção automática"
        required: false
        type: string
      run_cycle:
        description: "Ciclo UTC 00, 06, 12 ou 18; vazio = seleção automática"
        required: false
        type: string
      forecast_hours:
        description: "Leads nativos separados por vírgula; os PNG/JSON são exportados a cada hora"
        required: false
        default: "0,6,12,18,24,30,36,42,48,54,60,66,72,78,84,90,96,102,108,114,120,126,132,138,144,150,156,162,168"
        type: string
  schedule:
    - cron: "15 1,13 * * *"

permissions:
  contents: write

concurrency:
  group: sideral-multimodels-05
  cancel-in-progress: false

jobs:
  multimodels:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      GFS_REQUEST_DELAY_SECONDS: "10"
      LOG_LEVEL: INFO
    steps:
      - name: Checkout do repositório (contém apenas este YAML)
        uses: actions/checkout@v4

      - name: "Motor embutido — parte 1/4"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sideral_embedded
          cat > .sideral_embedded/part01.b64 <<'SIDERAL_PAYLOAD_1'
          
          SIDERAL_PAYLOAD_1
      - name: "Motor embutido — parte 2/4"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sideral_embedded
          cat > .sideral_embedded/part02.b64 <<'SIDERAL_PAYLOAD_2'
          
          SIDERAL_PAYLOAD_2
      - name: "Motor embutido — parte 3/4"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sideral_embedded
          cat > .sideral_embedded/part03.b64 <<'SIDERAL_PAYLOAD_3'
          
          SIDERAL_PAYLOAD_3
      - name: "Motor embutido — parte 4/4"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sideral_embedded
          cat > .sideral_embedded/part04.b64 <<'SIDERAL_PAYLOAD_4'
          
          SIDERAL_PAYLOAD_4
      - name: Reconstruir os arquivos do motor dentro do runner
        shell: bash
        run: |
          set -euo pipefail
          cat .sideral_embedded/part*.b64 > .sideral_embedded/engine.b64
          base64 --decode .sideral_embedded/engine.b64 > .sideral_embedded/engine.zip
          # O checkout pode conter uma extração antiga do motor. Limpar apenas
          # o diretório temporário do runner evita prompts interativos do unzip.
          rm -rf sideral-multimodels-05
          unzip -oq .sideral_embedded/engine.zip -d .
          test -s sideral-multimodels-05/config.yml
          test -s sideral-multimodels-05/src/sideral_multimodels/processing.py
          echo "Motor reconstruído com sucesso. O repositório continua contendo somente YAML."

      - name: Preparar bibliotecas de GRIB2
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-tools gdal-bin unzip

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do motor embutido
        working-directory: sideral-multimodels-05
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Testes unitários
        working-directory: sideral-multimodels-05
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Baixar e validar fronteiras estaduais e provinciais
        shell: bash
        run: |
          set -euo pipefail
          BOUNDARY_SOURCE_URL="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_1_states_provinces.geojson"
          BOUNDARY_RAW="$RUNNER_TEMP/ne_10m_admin_1_states_provinces.geojson"
          BOUNDARY_FILTERED="$RUNNER_TEMP/br_arg_admin1.geojson"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            "$BOUNDARY_SOURCE_URL" -o "$BOUNDARY_RAW"
          python - "$BOUNDARY_RAW" "$BOUNDARY_FILTERED" "$BOUNDARY_SOURCE_URL" <<'PY'
          import json, re, sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          url = sys.argv[3]
          payload = json.loads(source.read_text(encoding="utf-8"))

          def country_key(properties):
              values = []
              for key in ("admin", "ADMIN", "admin_en", "sovereignt", "SOVEREIGNT", "adm0_a3", "ADM0_A3", "adm0_a3_us", "geonunit"):
                  value = str(properties.get(key, "")).strip().lower()
                  if value:
                      values.append(value)
              joined = " | ".join(values)
              compact = {re.sub(r"[^a-z0-9]+", "", value) for value in values}
              if "brazil" in joined or compact & {"bra", "brasil", "federativerepublicofbrazil"}:
                  return "Brazil"
              if "argentina" in joined or compact & {"arg", "argentinerepublic", "argentine"}:
                  return "Argentina"
              return None

          selected = []
          counts = {"Brazil": 0, "Argentina": 0}
          for feature in payload.get("features", []):
              properties = feature.get("properties") or {}
              country = country_key(properties)
              geometry = feature.get("geometry") or {}
              if country in counts and geometry.get("type") in {"Polygon", "MultiPolygon"}:
                  selected.append(feature)
                  counts[country] += 1

          if counts["Brazil"] < 20 or counts["Argentina"] < 20:
              raise SystemExit(f"ERRO: camada de fronteiras incompleta: {counts}; esperado Brasil e Argentina com estados/províncias")

          filtered = {
              "type": "FeatureCollection",
              "name": "br_arg_admin1",
              "source": url,
              "sourceScale": "1:10m",
              "countries": ["Brazil", "Argentina"],
              "license": "Natural Earth public-domain data; verify terms at naturalearthdata.com",
              "features": selected,
          }
          target.write_text(json.dumps(filtered, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print(f"Fronteiras validadas: Brasil={counts['Brazil']} unidades; Argentina={counts['Argentina']} unidades; total={len(selected)}")
          PY
          echo "SIDERAL_ADMIN1_GEOJSON=$BOUNDARY_FILTERED" >> "$GITHUB_ENV"

      - name: Baixar e preparar limites municipais brasileiros do IBGE (com fontes alternativas)
        shell: bash
        run: |
          set -euo pipefail
          MUNICIPAL_RAW="$RUNNER_TEMP/br_municipalities_ibge.geojson"
          MUNICIPAL_DIR="$RUNNER_TEMP/br_municipalities_by_region"
          MUNICIPAL_ZIP="$RUNNER_TEMP/BR_Municipios_2025.zip"
          MUNICIPAL_EXTRACT="$RUNNER_TEMP/BR_Municipios_2025"
          MUNICIPAL_SOURCE_URL="https://servicodados.ibge.gov.br/api/v3/malhas/BR?formato=application%2Fvnd.geo%2Bjson&resolucao=5&qualidade=intermediaria"
          mkdir -p "$MUNICIPAL_DIR"
          rm -f "$MUNICIPAL_RAW"

          # Checa se o arquivo é um FeatureCollection municipal utilizável.
          valid_municipal_geojson() {
            local path="$1"
            [[ -s "$path" ]] || return 1
            python - "$path" <<'PYVALID'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  payload = json.load(fh)
              features = payload.get("features") if isinstance(payload, dict) else None
              if not isinstance(features, list) or len(features) < 5000:
                  raise ValueError(f"FeatureCollection insuficiente: {len(features) if isinstance(features, list) else 'inválida'}")
              valid = sum(1 for f in features if isinstance(f, dict) and (f.get("geometry") or {}).get("type") in {"Polygon", "MultiPolygon"})
              if valid < 5000:
                  raise ValueError(f"somente {valid} polígonos válidos")
              print(f"GeoJSON municipal validado: {valid} polígonos")
          except Exception as exc:
              print(f"GeoJSON municipal inválido: {exc}", file=sys.stderr)
              raise SystemExit(1)
          PYVALID
          }

          MUNICIPAL_OK=0
          echo "Tentando API oficial de malhas do IBGE..."
          if curl --fail --location --silent --show-error \
              --connect-timeout 15 --max-time 240 \
              --retry 2 --retry-all-errors --retry-delay 5 \
              "$MUNICIPAL_SOURCE_URL" -o "$MUNICIPAL_RAW"; then
            if valid_municipal_geojson "$MUNICIPAL_RAW"; then
              MUNICIPAL_OK=1
              echo "Malha municipal obtida pela API oficial do IBGE."
            else
              rm -f "$MUNICIPAL_RAW"
            fi
          else
            rm -f "$MUNICIPAL_RAW"
            echo "::warning:: API de malhas do IBGE não respondeu; tentando o FTP oficial."
          fi

          # Segunda fonte: ZIP oficial do IBGE. Simplifica apenas a geometria cartográfica
          # (0,005 grau); não modifica nenhum dado meteorológico nem a grade de 0,25°.
          if [[ "$MUNICIPAL_OK" -eq 0 ]]; then
            MUNICIPAL_ZIP_URL="https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2025/Brasil/BR_Municipios_2025.zip"
            if curl --fail --location --silent --show-error \
                --connect-timeout 25 --max-time 900 \
                --retry 2 --retry-all-errors --retry-delay 8 \
                "$MUNICIPAL_ZIP_URL" -o "$MUNICIPAL_ZIP"; then
              rm -rf "$MUNICIPAL_EXTRACT"
              mkdir -p "$MUNICIPAL_EXTRACT"
              if unzip -oq "$MUNICIPAL_ZIP" -d "$MUNICIPAL_EXTRACT"; then
                MUNICIPAL_SHP="$(find "$MUNICIPAL_EXTRACT" -type f -iname '*.shp' -print -quit || true)"
                if [[ -n "$MUNICIPAL_SHP" ]] && \
                   ogr2ogr -f GeoJSON -t_srs EPSG:4326 -simplify 0.005 \
                     "$MUNICIPAL_RAW" "$MUNICIPAL_SHP"; then
                  MUNICIPAL_SOURCE_URL="$MUNICIPAL_ZIP_URL"
                  if valid_municipal_geojson "$MUNICIPAL_RAW"; then
                    MUNICIPAL_OK=1
                    echo "Malha municipal obtida do ZIP oficial do IBGE e simplificada para cartografia."
                  else
                    rm -f "$MUNICIPAL_RAW"
                  fi
                fi
              fi
            else
              echo "::warning:: FTP oficial do IBGE não respondeu; tentando espelho GeoJSON."
            fi
          fi

          # Terceira fonte de contingência: GeoJSON público derivado de dados do IBGE.
          # Usado apenas se as duas fontes oficiais estiverem inacessíveis.
          if [[ "$MUNICIPAL_OK" -eq 0 ]]; then
            MUNICIPAL_MIRROR_URL="https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-100-mun.json"
            if curl --fail --location --silent --show-error \
                --connect-timeout 15 --max-time 180 \
                --retry 2 --retry-all-errors --retry-delay 5 \
                "$MUNICIPAL_MIRROR_URL" -o "$MUNICIPAL_RAW" && \
                valid_municipal_geojson "$MUNICIPAL_RAW"; then
              MUNICIPAL_SOURCE_URL="$MUNICIPAL_MIRROR_URL"
              MUNICIPAL_OK=1
              echo "::warning:: Usando espelho comunitário de GeoJSON derivado do IBGE; a data pode ser anterior à malha oficial atual."
            else
              rm -f "$MUNICIPAL_RAW"
            fi
          fi

          echo "SIDERAL_MUNICIPIOS_DIR=$MUNICIPAL_DIR" >> "$GITHUB_ENV"
          if [[ "$MUNICIPAL_OK" -ne 1 ]]; then
            echo "SIDERAL_MUNICIPIOS_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "SIDERAL_MUNICIPIOS_SOURCE=unavailable" >> "$GITHUB_ENV"
            echo "::warning:: Não foi possível obter a malha municipal. A rodada meteorológica continuará; os contornos de estados e províncias continuam disponíveis."
            exit 0
          fi

          # Reduz o tamanho da camada para que os GeoJSONs regionais continuem publicáveis
          # no GitHub. 0,005 grau (~500 m) é adequado para contornos em mapas de grade 0,25°.
          MUNICIPAL_SIMPLIFIED="$RUNNER_TEMP/br_municipalities_simplified.geojson"
          if ogr2ogr -f GeoJSON -t_srs EPSG:4326 -simplify 0.005 \
              "$MUNICIPAL_SIMPLIFIED" "$MUNICIPAL_RAW"; then
            if valid_municipal_geojson "$MUNICIPAL_SIMPLIFIED"; then
              mv "$MUNICIPAL_SIMPLIFIED" "$MUNICIPAL_RAW"
              echo "Camada municipal simplificada para uso cartográfico regional."
            else
              rm -f "$MUNICIPAL_SIMPLIFIED"
              echo "::warning:: A simplificação não passou na validação; mantendo o arquivo original."
            fi
          else
            rm -f "$MUNICIPAL_SIMPLIFIED"
            echo "::warning:: Não foi possível simplificar a malha; mantendo a fonte original."
          fi

          echo "SIDERAL_MUNICIPIOS_AVAILABLE=true" >> "$GITHUB_ENV"
          echo "SIDERAL_MUNICIPIOS_SOURCE=$MUNICIPAL_SOURCE_URL" >> "$GITHUB_ENV"
          python - "$MUNICIPAL_RAW" "$MUNICIPAL_DIR" "$GITHUB_WORKSPACE/sideral-multimodels-05/config.yml" "$MUNICIPAL_SOURCE_URL" <<'PY'
          import json, math, re, sys
          from pathlib import Path
          import yaml

          source = Path(sys.argv[1])
          out_dir = Path(sys.argv[2])
          config_path = Path(sys.argv[3])
          source_url = sys.argv[4]
          payload = json.loads(source.read_text(encoding="utf-8"))
          features = payload.get("features") if isinstance(payload, dict) else None
          if not isinstance(features, list) or len(features) < 5000:
              actual = len(features) if isinstance(features, list) else "not a FeatureCollection"
              raise SystemExit(f"ERRO: malha municipal incompleta: {actual}; esperado pelo menos 5.000 municípios/unidades")

          config = yaml.safe_load(config_path.read_text(encoding="utf-8"))
          regions = config.get("regions", [])
          if not regions:
              raise SystemExit("ERRO: config.yml não define regiões para filtrar os limites municipais")

          def iter_points(value):
              if isinstance(value, (list, tuple)):
                  if len(value) >= 2 and isinstance(value[0], (int, float)) and isinstance(value[1], (int, float)):
                      yield float(value[0]), float(value[1])
                  else:
                      for child in value:
                          yield from iter_points(child)

          def feature_bbox(feature):
              bbox = feature.get("bbox")
              if isinstance(bbox, list) and len(bbox) >= 4:
                  try:
                      x0, y0, x1, y1 = map(float, bbox[:4])
                      if all(map(math.isfinite, (x0, y0, x1, y1))):
                          return x0, y0, x1, y1
                  except (TypeError, ValueError):
                      pass
              geometry = feature.get("geometry") or {}
              points = iter_points(geometry.get("coordinates", []))
              first = next(points, None)
              if first is None:
                  return None
              minx = maxx = first[0]
              miny = maxy = first[1]
              for x, y in points:
                  minx, maxx = min(minx, x), max(maxx, x)
                  miny, maxy = min(miny, y), max(maxy, y)
              return minx, miny, maxx, maxy

          prepared = []
          for feature in features:
              if not isinstance(feature, dict):
                  continue
              geometry = feature.get("geometry") or {}
              if geometry.get("type") not in {"Polygon", "MultiPolygon"}:
                  continue
              bbox = feature_bbox(feature)
              if bbox is not None:
                  prepared.append((feature, bbox))
          if len(prepared) < 5000:
              raise SystemExit(f"ERRO: somente {len(prepared)} polígonos municipais válidos após leitura")

          counts = {}
          for region in regions:
              slug = re.sub(r"[^a-z0-9_-]+", "_", str(region.get("slug", "region")).lower()).strip("_")
              lat_min = float(region["latitude_min"])
              lat_max = float(region["latitude_max"])
              lon_min = float(region["longitude_min"])
              lon_max = float(region["longitude_max"])
              selected = []
              for feature, (minx, miny, maxx, maxy) in prepared:
                  if maxx >= lon_min and minx <= lon_max and maxy >= lat_min and miny <= lat_max:
                      selected.append(feature)
              if slug != "argentina" and len(selected) < 50:
                  raise SystemExit(f"ERRO: limites municipais insuficientes para {slug}: {len(selected)} feições")
              result = {
                  "type": "FeatureCollection",
                  "name": f"brazil_municipalities_{slug}",
                  "source": source_url,
                  "sourceAgency": "IBGE-derived",
                  "sourceScale": "Malha municipal usada para visualização; fonte identificada em source",
                  "country": "Brazil",
                  "regionSlug": slug,
                  "regionBounds": {"longitudeMin": lon_min, "longitudeMax": lon_max, "latitudeMin": lat_min, "latitudeMax": lat_max},
                  "featureCount": len(selected),
                  "features": selected,
              }
              dest = out_dir / f"{slug}.geojson"
              dest.write_text(json.dumps(result, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              counts[slug] = len(selected)
              print(f"Municípios preparados para {slug}: {len(selected)} feições -> {dest}")
          print("Resumo de limites municipais: " + json.dumps(counts, ensure_ascii=False))
          PY

      - name: Executar download, regrade de 0,25° e consenso por região
        working-directory: sideral-multimodels-05
        env:
          PYTHONPATH: src
          RUN_DATE: ${{ inputs.run_date }}
          RUN_CYCLE: ${{ inputs.run_cycle }}
          FORECAST_HOURS: ${{ inputs.forecast_hours }}
        shell: bash
        run: |
          set -euo pipefail
          # Compatibilidade com as duas interfaces CLI encontradas nos pacotes embutidos:
          # versões com subcomandos exigem "run"; versões com argumentos na raiz não aceitam "run".
          COMMON_ARGS=(
            --config config.yml
            --date "${RUN_DATE:-}"
            --cycle "${RUN_CYCLE:-}"
            --hours "${FORECAST_HOURS:-}"
            --raw-dir data/raw
            --output-dir output
          )
          if grep -Eq 'add_subparsers\(' src/sideral_multimodels/cli.py; then
            echo "CLI com subcomandos detectada; executando comando run."
            python -m sideral_multimodels run "${COMMON_ARGS[@]}"
          else
            echo "CLI sem subcomandos detectada; executando argumentos diretamente."
            python -m sideral_multimodels "${COMMON_ARGS[@]}"
          fi

      - name: Incluir camadas administrativas no pacote de saída
        if: success()
        working-directory: sideral-multimodels-05
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SIDERAL_ADMIN1_GEOJSON"
          mkdir -p output/cartography
          cp "$SIDERAL_ADMIN1_GEOJSON" output/cartography/br_arg_admin1.geojson
          MUNICIPAL_COUNT=0
          if [[ "${SIDERAL_MUNICIPIOS_AVAILABLE:-false}" == "true" ]] && [[ -d "${SIDERAL_MUNICIPIOS_DIR:-}" ]]; then
            shopt -s nullglob
            MUNICIPAL_FILES=("$SIDERAL_MUNICIPIOS_DIR"/*.geojson)
            shopt -u nullglob
            if (( ${#MUNICIPAL_FILES[@]} > 0 )); then
              cp "${MUNICIPAL_FILES[@]}" output/cartography/
              MUNICIPAL_COUNT="${#MUNICIPAL_FILES[@]}"
            fi
          fi
          cat > output/cartography/README.md <<EOF
          # Fronteiras administrativas — Brasil e Argentina

          - \`br_arg_admin1.geojson\`: unidades de primeiro nível (estados brasileiros e províncias argentinas) da camada Natural Earth 1:10m Admin-1 States and Provinces.
          - \`brazil_municipalities_<região>.geojson\`: limites municipais brasileiros por região, quando uma das fontes de malha pôde ser acessada.

          Fonte Natural Earth: https://www.naturalearthdata.com/
          Fonte municipal preferencial: https://servicodados.ibge.gov.br/api/v3/malhas/BR?formato=application%2Fvnd.geo%2Bjson&resolucao=5&qualidade=intermediaria
          Alternativa oficial: https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2025/Brasil/BR_Municipios_2025.zip
          Espelho de contingência (pode estar desatualizado): https://github.com/tbrugz/geodata-br
          Referência IBGE: https://www.ibge.gov.br/geociencias/organizacao-do-territorio/malhas-territoriais/15774-malhas.html

          Fonte usada nesta execução: ${SIDERAL_MUNICIPIOS_SOURCE:-unavailable}
          Arquivos municipais incluídos: ${MUNICIPAL_COUNT}

          Os GeoJSONs são camadas cartográficas separadas e não alteram a grade meteorológica de 0,25°. Os contornos municipais não recebem rótulos no PNG para manter a legibilidade; nomes e códigos ficam nas propriedades das feições quando fornecidos pela fonte.
          EOF
          if (( MUNICIPAL_COUNT > 0 )); then
            echo "Camadas administrativas incluídas: fronteiras nacionais/estaduais/provinciais e $MUNICIPAL_COUNT camadas municipais."
          else
            echo "::warning:: Malha municipal indisponível nesta execução; foram mantidos os contornos estaduais e provinciais."
          fi

      - name: Validar continuidade dos frames PNG/JSON
        working-directory: sideral-multimodels-05
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          output = Path("output")
          manifests = sorted(output.rglob("manifest.json"))
          if not manifests:
              raise SystemExit("ERRO: nenhum manifest.json de rodada foi gerado")

          for manifest_path in manifests:
              run_dir = manifest_path.parent
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              hours = manifest.get("productForecastHours", manifest.get("forecastHours", []))
              products = manifest.get("forecastProducts", [])
              if not hours:
                  raise SystemExit(f"ERRO: forecastHours vazio em {manifest_path}")
              expected = list(range(int(hours[0]), int(hours[-1]) + 1))
              if [int(hour) for hour in hours] != expected:
                  raise SystemExit(f"ERRO: manifest contém lacunas em {manifest_path}")
              product_hours = [int(item["forecastHour"]) for item in products]
              if product_hours != expected:
                  raise SystemExit(f"ERRO: lista de produtos não é contínua em {manifest_path}")

              missing = []
              for lead in expected:
                  for suffix in ("png", "json"):
                      product_path = run_dir / "forecast" / f"f{lead:03d}.{suffix}"
                      if not product_path.is_file() or product_path.stat().st_size == 0:
                          missing.append(str(product_path))
              if missing:
                  raise SystemExit("ERRO: frames ausentes: " + ", ".join(missing[:30]))
              print(f"OK: {run_dir}: {len(expected)} leads contínuos, cada um com PNG e JSON.")
          PY

