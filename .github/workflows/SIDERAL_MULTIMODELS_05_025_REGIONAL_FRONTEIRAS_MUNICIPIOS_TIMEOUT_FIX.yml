            exit 1
          fi
          echo "Arquivos preparados para publicação: $FILE_COUNT"

          # O GitHub rejeita arquivos individuais acima de 100 MiB.
          LARGE_FILES="$(find "$SNAPSHOT" -type f -size +95M -print || true)"
          if [ -n "$LARGE_FILES" ]; then
            echo "ERRO: há arquivos acima de 95 MiB, perto do limite de tamanho individual do GitHub o limite de arquivo do GitHub:"
